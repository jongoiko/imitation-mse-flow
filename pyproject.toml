[project]
name = "imitation-bc-fm"
version = "0.1.0"
description = "Behavior cloning experiments with MSE and flow matching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "einops>=0.8.2",
    "gym-pusht",
    "gymnasium>=1.3.0",
    "h5py>=3.16.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "mujoco<3.10",
    "pillow>=12.3.0",
    "robomimic",
    "robosuite",
    "torch>=2.14.0",
    "tqdm>=4.70.0",
    "tyro>=1.0.16",
    "wandb>=0.29.0",
    "zarr>=3.3.0",
]

[tool.uv.sources]
gym-pusht = { git = "https://github.com/jongoiko/gym-pusht.git" }
robomimic = { git = "https://github.com/ARISE-Initiative/robomimic", rev = "8c0f810" }
robosuite = { git = "https://github.com/ARISE-Initiative/robosuite", branch = "v1.4.1" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
